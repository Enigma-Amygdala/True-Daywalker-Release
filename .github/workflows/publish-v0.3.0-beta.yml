name: Publish True Daywalker v0.3.0 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-v0.3.0-beta.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release archive
        shell: bash
        run: |
          echo "941db05da6bb40d0c96c125c8c62978c0297b8d2aaf755a2bdcc6f9ee8585ce1  TrueDaywalker-0.3.0-Beta.zip" | sha256sum -c -

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          # True Daywalker 0.3.0 Beta

          **One hybrid ruleset, day or night.**

          This is the first public beta of True Daywalker for *The Blood of Dawnwalker*.

          ## Compatibility

          - Tested game build: `CL-258504`
          - Supported `Dawnwalker.exe` SHA-256: `E565BD97FBA398ECB1CA79CA2AA2CC2E5D43156A0937D7E202E73B3B85ED5086`
          - Unsupported executable builds fail closed.

          ## Integrity

          - Release ZIP SHA-256: `941db05da6bb40d0c96c125c8c62978c0297b8d2aaf755a2bdcc6f9ee8585ce1`
          - Gameplay DLL SHA-256: `c521990e5b8e69bab2178ddc5dbcd077211e908e87557c35a370d2b42c316237`

          ## Source / audit material

          Source, build instructions, hashes, and security-review notes:
          https://github.com/Enigma-Amygdala/True-Daywalker

          Nexus page:
          https://www.nexusmods.com/thebloodofdawnwalker/mods/554
          EOF

          if gh release view v0.3.0-beta >/dev/null 2>&1; then
            gh release upload v0.3.0-beta TrueDaywalker-0.3.0-Beta.zip --clobber
            gh release edit v0.3.0-beta --title "True Daywalker 0.3.0 Beta" --notes-file /tmp/release-notes.md --prerelease
          else
            gh release create v0.3.0-beta TrueDaywalker-0.3.0-Beta.zip               --title "True Daywalker 0.3.0 Beta"               --notes-file /tmp/release-notes.md               --prerelease               --target "${GITHUB_SHA}"
          fi
