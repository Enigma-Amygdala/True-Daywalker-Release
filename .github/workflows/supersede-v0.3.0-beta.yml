name: Supersede True Daywalker 0.3.0 Beta

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/supersede-v0.3.0-beta.yml"

permissions:
  contents: write

jobs:
  supersede:
    runs-on: ubuntu-latest
    steps:
      - name: Mark 0.3.0 Beta as superseded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          cat > /tmp/old-notes.md <<'EOF'
          # True Daywalker 0.3.0 Beta — Superseded

          **Do not use this build for new installations.**

          0.3.0 Beta has been superseded by **0.4.4 Beta** after a progression-blocking hybrid-form issue was identified that could prevent Astral Communion at haunted sites and Compel interactions with eligible corpses.

          **Current release:**
          https://github.com/Enigma-Amygdala/True-Daywalker-Release/releases/tag/v0.4.4-beta

          **Current download:**
          https://github.com/Enigma-Amygdala/True-Daywalker-Release/releases/download/v0.4.4-beta/TrueDaywalker-0.4.4-Beta.zip

          The 0.3.0 release remains here for version history and provenance only.
          EOF

          gh release edit v0.3.0-beta \
            --title "True Daywalker 0.3.0 Beta — Superseded" \
            --notes-file /tmp/old-notes.md \
            --prerelease

          gh api --method PATCH \
            "repos/${GH_REPO}/releases/assets/571738086" \
            -f name="TrueDaywalker-0.3.0-Beta-SUPERSEDED.zip" \
            -f label="Superseded — known progression blocker; use 0.4.4 Beta"
