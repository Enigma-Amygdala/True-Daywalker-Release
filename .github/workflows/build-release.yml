name: Build release mirror

on:
  push:
    paths:
      - ".release-parts/part-11"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Publish True Daywalker 0.3.0 Beta binary mirror')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat .release-parts/part-* > release.b64
          base64 --decode release.b64 > TrueDaywalker-0.3.0-Beta.zip
          echo "941db05da6bb40d0c96c125c8c62978c0297b8d2aaf755a2bdcc6f9ee8585ce1  TrueDaywalker-0.3.0-Beta.zip" | sha256sum -c -
          unzip -t TrueDaywalker-0.3.0-Beta.zip

      - name: Publish binary mirror
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .release-parts release.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish True Daywalker 0.3.0 Beta binary mirror"
          git push
