name: Publish True Daywalker ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/publish-release-zip.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified release ZIP
        shell: bash
        run: |
          cat .release_payload/part*.b64 | base64 --decode > TrueDaywalker-0.3.0-Beta.zip
          echo "941db05da6bb40d0c96c125c8c62978c0297b8d2aaf755a2bdcc6f9ee8585ce1  TrueDaywalker-0.3.0-Beta.zip" | sha256sum -c -

      - name: Publish ZIP to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TrueDaywalker-0.3.0-Beta.zip
          git rm -r .release_payload
          git rm .github/workflows/publish-release-zip.yml
          git commit -m "Publish True Daywalker 0.3.0 Beta"
          git push
